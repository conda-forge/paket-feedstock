context:
  version: "11.0.0"

package:
  name: paket
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/paket/archive/${{ version }}.tar.gz
  sha256: 8891f71fd7a53258b7d014f63d2851a2c77efff4415d256bb8c954949b2647e9

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - paket --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: A dependency manager for .NET with support for NuGet packages and Git repositories
  homepage: https://fsprojects.github.io/Paket
  repository: https://github.com/fsprojects/paket

extra:
  recipe-maintainers:
    - danielnachun
