context:
  version: "12.0.0"

package:
  name: paket
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/paket/archive/${{ version }}.tar.gz
  sha256: eb64cc927aefa9003bb6248a242d9b816881ca55717c2a3e36332af1b3c5c597

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - paket --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: A dependency manager for .NET with support for NuGet packages and Git repositories
  homepage: https://fsprojects.github.io/Paket
  repository: https://github.com/fsprojects/paket

extra:
  recipe-maintainers:
    - danielnachun
