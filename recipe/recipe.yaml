context:
  version: "11.0.1"

package:
  name: paket
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/paket/archive/${{ version }}.tar.gz
  sha256: dc6caa3f21c85eb4335587ba59b4ef3d6c0295fc62fd06fc7426fd9bc5396227

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - paket --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: A dependency manager for .NET with support for NuGet packages and Git repositories
  homepage: https://fsprojects.github.io/Paket
  repository: https://github.com/fsprojects/paket

extra:
  recipe-maintainers:
    - danielnachun
