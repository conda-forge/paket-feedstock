context:
  version: "10.3.1"

package:
  name: paket
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/paket/archive/${{ version }}.tar.gz
  sha256: c101645bcda61fc3cc6f40be0ff57eda79908738a3ee4f29706a8c08288667de

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - paket --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: A dependency manager for .NET with support for NuGet packages and Git repositories
  homepage: https://fsprojects.github.io/Paket
  repository: https://github.com/fsprojects/paket

extra:
  recipe-maintainers:
    - danielnachun
